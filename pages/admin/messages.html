    <script src="../../scripts/utils/runtime-api-port.js"></script>
    <script src="../../scripts/utils/api.js"></script>
    <script src="../../scripts/utils/auth-guard.js"></script>
    <script>
        // Messages loaded from backend conversations for the current admin (shared with admin/messages.js)
        var allMessages = [];

        function getTimeAgo(date) {
            if (!(date instanceof Date)) {
                date = new Date(date);
            }
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} ${diffMins === 1 ? 'Minute' : 'Minutes'} Ago`;
            if (diffHours < 24) return `${diffHours} ${diffHours === 1 ? 'Hour' : 'Hours'} Ago`;
            if (diffDays < 7) return `${diffDays} ${diffDays === 1 ? 'Day' : 'Days'} Ago`;
            return date.toLocaleDateString();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Track if viewing spam/blocked messages
        let isViewingSpam = false;

        function renderMessages(messagesToRender = null) {
            const messagesList = document.getElementById('messagesList');
            if (!messagesList) {
                console.error('messagesList not found');
                return;
            }

            const loadingIndicator = document.getElementById('loadingIndicator');
            if (loadingIndicator) {
                loadingIndicator.remove();
            }

            // Use provided messages or filter from allMessages
            let filteredMessages;
            if (messagesToRender) {
                filteredMessages = messagesToRender;
            } else {
                // Default: show non-blocked messages
                filteredMessages = allMessages.filter(msg => !msg.blocked);
            }
            
            if (filteredMessages.length === 0) {
                messagesList.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #6B7280;">
                        <p style="font-size: 16px; margin: 0;">No messages found.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filteredMessages.forEach(msg => {
                const isUnread = msg.status === 'unread';
                const timeAgo = getTimeAgo(msg.date);
                const badges = [];
                
                if (msg.status === 'unread') badges.push({ text: 'Unread', class: 'unread' });
                else badges.push({ text: 'Read', class: 'read' });
                if (msg.starred) badges.push({ text: '(marked)', class: 'marked' });
                if (msg.status === 'pending') badges.push({ text: 'Pending', class: 'pending' });
                if (msg.important) badges.push({ text: 'Important', class: 'important' });
                
                const badgesHtml = badges.length > 0 ? `
                    <div class="message-badges">
                        ${badges.map(badge => `
                            <span class="status-badge ${badge.class}">${badge.text}</span>
                        `).join('')}
                    </div>
                ` : '';
                
                html += `
                <div class="message-card ${isUnread ? 'unread' : 'read'}">
                    <div class="message-card-content">
                        <div class="message-sender-info">
                            <h3 class="message-sender-name">${escapeHtml(msg.fullName)}</h3>
                            <p class="message-sender-email">${escapeHtml(msg.email)}</p>
                        </div>
                        <h4 class="message-subject">${escapeHtml(msg.topic || 'No topic')}</h4>
                        <p class="message-preview">${escapeHtml(msg.message)}</p>
                        ${badgesHtml}
                    </div>
                    <div class="message-actions-right">
                        <div class="message-icon-actions">
                            <button class="message-icon-btn ${msg.starred ? 'starred' : ''}" onclick="toggleStar(${msg.id})" title="${msg.starred ? 'Unstar' : 'Star'}">
                                <i class="fi ${msg.starred ? 'fi-sr-star' : 'fi-rr-star'}"></i>
                            </button>
                            <button class="message-icon-btn ${msg.blocked ? 'unblock-btn' : ''}" onclick="toggleBlock(${msg.id})" title="${msg.blocked ? 'Unblock (move to normal)' : 'Block/Spam'}">
                                <i class="fi ${msg.blocked ? 'fi-rr-check-circle' : 'fi-rr-circle-xmark'}"></i>
                            </button>
                        </div>
                        <p class="message-time">${timeAgo}</p>
                        <button class="btn-view-message" onclick="showMessageDetail(${msg.id})">
                            View Message
                        </button>
                    </div>
                </div>
                `;
            });
            
            messagesList.innerHTML = html;
            console.log('Messages rendered:', filteredMessages.length);
        }

        // Filter messages function
        function filterMessages() {
            const searchInput = document.getElementById('messageSearch');
            const statusFilter = document.getElementById('statusFilter');
            const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const selectedStatus = statusFilter ? statusFilter.value : 'all';
            
            let filtered = allMessages.filter(msg => {
                // Don't show blocked messages unless viewing spam
                if (msg.blocked && !isViewingSpam) {
                    return false;
                }
                
                // If viewing spam, only show blocked messages
                if (isViewingSpam && !msg.blocked) {
                    return false;
                }
                
                // Search filter
                const matchesSearch = !searchTerm || 
                    msg.fullName.toLowerCase().includes(searchTerm) ||
                    msg.email.toLowerCase().includes(searchTerm) ||
                    (msg.topic && msg.topic.toLowerCase().includes(searchTerm)) ||
                    msg.message.toLowerCase().includes(searchTerm);
                
                // Status filter
                const matchesStatus = selectedStatus === 'all' || msg.status === selectedStatus;
                
                return matchesSearch && matchesStatus;
            });
            
            renderMessages(filtered);
        }

        // Load messages from API (admin's conversations with users)
        async function loadMessagesFromAPI() {
            const messagesList = document.getElementById('messagesList');
            const loadingIndicator = document.getElementById('loadingIndicator');
            
            if (!window.API || !API.messages || !API.messages.getConversations) {
                console.warn('API.messages.getConversations not available, using sample data (if any).');
                renderMessages();
                return;
            }

            if (loadingIndicator) {
                loadingIndicator.textContent = 'Loading messages from server...';
            }

            try {
                // Get current user (admin) so we can find the other side of conversations
                let currentUser = API.getCurrentUser && API.getCurrentUser();
                if (!currentUser && API.auth && API.auth.getCurrentUser) {
                    try {
                        const resMe = await API.auth.getCurrentUser();
                        if (resMe && resMe.user) {
                            currentUser = resMe.user;
                            if (API.setCurrentUser) API.setCurrentUser(currentUser);
                        }
                    } catch (_) {}
                }

                const res = await API.messages.getConversations();
                const conversations = res.conversations || [];

                allMessages = [];
                let idCounter = 1;

                conversations.forEach(conv => {
                    const otherUser =
                        currentUser && conv.user1 && conv.user1.id === currentUser.id
                            ? conv.user2
                            : conv.user1;

                    const latest = (conv.messages && conv.messages[0]) || null;
                    const isFromPlayer = latest && currentUser && latest.sender && latest.sender.id !== currentUser.id;
                    const isUnread = isFromPlayer && latest && !latest.readAt;
                    const blocked = !!(conv.blockedAt);
                    const starred = !!(conv.starredAt);

                    allMessages.push({
                        id: idCounter++,
                        conversationId: conv.id,
                        latestMessageId: latest ? latest.id : null,
                        fullName: otherUser ? (otherUser.fullName || 'User') : 'User',
                        email: otherUser ? (otherUser.email || '') : '',
                        phone: '',
                        topic: latest ? (latest.content.slice(0, 60) + (latest.content.length > 60 ? '...' : '')) : 'Conversation',
                        message: latest ? latest.content : 'No messages yet.',
                        date: latest ? latest.createdAt : conv.updatedAt,
                        status: isUnread ? 'unread' : 'read',
                        starred,
                        important: false,
                        blocked
                    });
                });

                // Show newest first, consistent with getTimeAgo usage
                allMessages.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

                filterMessages();
            } catch (error) {
                console.error('Failed to load messages from API:', error);
                if (messagesList && loadingIndicator) {
                    loadingIndicator.textContent = 'Failed to load messages.';
                }
                // Fallback: render (possibly empty) local list
                renderMessages();
            }
        }

        // Toggle star function
        async function toggleStar(messageId) {
            const message = allMessages.find(m => m.id === messageId);
            if (!message) return;
            
            const newStarred = !message.starred;
            try {
                if (API && API.messages && API.messages.setStarred) {
                    await API.messages.setStarred(message.conversationId, newStarred);
                }
                message.starred = newStarred;
                filterMessages();
            } catch (e) {
                console.warn('Could not update star:', e);
            }
        }

        // Toggle Block: block normal message, or unblock to move back to normal
        async function toggleBlock(messageId) {
            const message = allMessages.find(m => m.id === messageId);
            if (!message) return;
            
            if (message.blocked) {
                if (!confirm(`Do you want to unblock this message from ${message.fullName}?`)) return;
                try {
                    if (API && API.messages && API.messages.setBlocked) {
                        await API.messages.setBlocked(message.conversationId, false);
                    }
                    message.blocked = false;
                    filterMessages();
                } catch (e) {
                    console.warn('Could not unblock:', e);
                    alert('Failed to unblock. Please try again.');
                }
            } else {
                if (!confirm(`Block/Spam message from ${message.fullName}?`)) return;
                try {
                    if (API && API.messages && API.messages.setBlocked) {
                        await API.messages.setBlocked(message.conversationId, true);
                    }
                    message.blocked = true;
                    filterMessages();
                } catch (e) {
                    console.warn('Could not block:', e);
                    alert('Failed to block. Please try again.');
                }
            }
        }

        // Show message detail modal - fetches and displays full conversation history
        async function showMessageDetail(messageId) {
            const message = allMessages.find(m => m.id === messageId);
            if (!message) return;
            
            // Mark as read when admin views (persist to backend)
            if (message.status === 'unread' && message.latestMessageId && message.conversationId) {
                message.status = 'read';
                filterMessages(); // Re-render to update status
                try {
                    if (window.API && API.messages && API.messages.markAsRead) {
                        await API.messages.markAsRead(message.conversationId, message.latestMessageId);
                    }
                } catch (e) {
                    console.warn('Could not mark message as read:', e);
                }
            }
            
            const messageContent = document.getElementById('messageContent');
            const messageModal = document.getElementById('messageModal');
            
            if (!messageContent || !messageModal) return;
            
            const initials = message.fullName.split(' ').map(n => n[0]).join('').toUpperCase();
            const currentUser = API.getCurrentUser ? API.getCurrentUser() : null;
            
            // Render header and loading state first
            messageContent.innerHTML = `
                <div class="message-detail-header">
                    <div class="message-detail-avatar">${initials}</div>
                    <div class="message-detail-info">
                        <h3 class="message-detail-name">${escapeHtml(message.fullName)}</h3>
                        <p class="message-detail-email">${escapeHtml(message.email)}</p>
                        ${message.phone ? `<p class="message-detail-phone">${escapeHtml(message.phone)}</p>` : ''}
                    </div>
                </div>
                <div class="message-detail-thread-loading"><i class="fi fi-rr-spinner"></i> Loading full conversation...</div>
                <div class="message-detail-thread" id="messageDetailThread" style="display:none;"></div>
            `;
            messageModal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Fetch full conversation and render all messages
            try {
                const res = await API.messages.getMessages(message.conversationId, { page: 1, limit: 200 });
                const messages = res.messages || [];
                const threadEl = document.getElementById('messageDetailThread');
                const loadingEl = messageContent.querySelector('.message-detail-thread-loading');
                
                if (loadingEl) loadingEl.remove();
                
                if (messages.length === 0) {
                    threadEl.innerHTML = '<div class="message-detail-empty">No messages in this conversation.</div>';
                } else {
                    const threadHtml = messages.map(m => {
                        const isFromAdmin = currentUser && m.sender && m.sender.id === currentUser.id;
                        const senderName = m.sender ? m.sender.fullName : 'Unknown';
                        const timeStr = m.createdAt ? getTimeAgo(m.createdAt) : '';
                        return `
                            <div class="message-detail-item ${isFromAdmin ? 'from-admin' : 'from-user'}">
                                <div class="message-detail-item-header">${escapeHtml(senderName)} · ${escapeHtml(timeStr)}</div>
                                <div class="message-detail-item-text">${escapeHtml(m.content)}</div>
                            </div>
                        `;
                    }).join('');
                    threadEl.innerHTML = '<div class="message-detail-thread-label">Full conversation history</div>' + threadHtml;
                }
                threadEl.style.display = 'block';
            } catch (e) {
                console.warn('Could not load full conversation:', e);
                const threadEl = document.getElementById('messageDetailThread');
                const loadingEl = messageContent.querySelector('.message-detail-thread-loading');
                if (loadingEl) loadingEl.remove();
                if (threadEl) {
                    threadEl.innerHTML = '<div class="message-detail-empty">Could not load full conversation. Showing latest only.</div><div class="message-detail-item from-user"><div class="message-detail-item-text">' + escapeHtml(message.message) + '</div></div>';
                    threadEl.style.display = 'block';
                }
            }
            
            // Add reply section and actions
            const replyDiv = document.createElement('div');
            replyDiv.innerHTML = `
                <div class="reply-section">
                    <h4 class="reply-section-title">Reply to ${escapeHtml(message.fullName)}</h4>
                    <form class="reply-form" id="replyForm${message.id}" onsubmit="handleReplySubmit(event, ${message.id})">
                        <div class="reply-form-group">
                            <label for="replyMessage${message.id}" class="reply-label">Your Reply</label>
                            <textarea id="replyMessage${message.id}" class="reply-textarea" rows="6" placeholder="Type your reply here..." required></textarea>
                        </div>
                        <div class="reply-form-actions">
                            <button type="button" class="btn-cancel-reply" onclick="cancelReply(${message.id})">Cancel</button>
                            <button type="submit" class="btn-send-reply"><i class="fi fi-rr-paper-plane"></i> Send Reply</button>
                        </div>
                    </form>
                </div>
                <div class="message-detail-actions">
                    <button class="btn-reply-toggle" onclick="toggleReplySection(${message.id})"><i class="fi fi-rr-envelope"></i> Reply</button>
                </div>
            `;
            while (replyDiv.firstChild) messageContent.appendChild(replyDiv.firstChild);
        }

        // Mark message as read
        function markAsRead(messageId) {
            const message = allMessages.find(m => m.id === messageId);
            if (!message) return;
            
            message.status = 'read';
            filterMessages(); // Re-render to show updated status
            console.log(`Message from ${message.fullName} marked as read`);
        }

        // Toggle reply section
        function toggleReplySection(messageId) {
            const replySection = document.querySelector(`#replyForm${messageId}`).closest('.reply-section');
            if (replySection) {
                replySection.classList.toggle('active');
                const textarea = document.getElementById(`replyMessage${messageId}`);
                if (replySection.classList.contains('active') && textarea) {
                    textarea.focus();
                }
            }
        }

        // Cancel reply
        function cancelReply(messageId) {
            const replySection = document.querySelector(`#replyForm${messageId}`).closest('.reply-section');
            const textarea = document.getElementById(`replyMessage${messageId}`);
            if (replySection) {
                replySection.classList.remove('active');
            }
            if (textarea) {
                textarea.value = '';
            }
        }

        // Handle reply form submission - sends in-app and notifies user
        async function handleReplySubmit(event, messageId) {
            event.preventDefault();
            const message = allMessages.find(m => m.id === messageId);
            if (!message) return;
            
            const textarea = document.getElementById(`replyMessage${messageId}`);
            const replyText = textarea ? textarea.value.trim() : '';
            
            if (!replyText) {
                alert('Please enter a reply message.');
                return;
            }
            
            const submitBtn = document.querySelector(`#replyForm${messageId} .btn-send-reply`);
            const originalHtml = submitBtn ? submitBtn.innerHTML : '';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fi fi-rr-spinner"></i> Sending...';
            }
            
            try {
                if (window.API && window.API.messages && window.API.messages.sendMessage && message.conversationId) {
                    await API.messages.sendMessage(message.conversationId, replyText);
                } else {
                    throw new Error('Cannot send reply. API or conversation ID not available.');
                }
                message.status = 'replied';
                filterMessages();
                closeMessageModal();
                alert('Reply sent. The user will see it in their notifications.');
            } catch (error) {
                console.error('Reply send error:', error);
                alert(error.message || 'Failed to send reply. Please try again.');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalHtml || '<i class="fi fi-rr-paper-plane"></i> Send Reply';
                }
            }
        }

        // Delete message
        function deleteMessage(messageId) {
            const message = allMessages.find(m => m.id === messageId);
            if (!message) return;
            
            if (confirm(`Delete message from ${message.fullName}?`)) {
                const index = allMessages.findIndex(m => m.id === messageId);
                if (index > -1) {
                    allMessages.splice(index, 1);
                }
                filterMessages(); // Re-render table
                console.log(`Message from ${message.fullName} deleted`);
            }
        }

        // Close message modal
        function closeMessageModal() {
            const messageModal = document.getElementById('messageModal');
            if (messageModal) {
                messageModal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        // Setup modal close handlers
        function setupModalHandlers() {
            const closeMessageModalBtn = document.getElementById('closeMessageModal');
            const messageModal = document.getElementById('messageModal');
            
            if (closeMessageModalBtn && messageModal) {
                closeMessageModalBtn.addEventListener('click', closeMessageModal);
                
                // Close on overlay click
                messageModal.addEventListener('click', (e) => {
                    if (e.target === messageModal) {
                        closeMessageModal();
                    }
                });
                
                // Close on Escape key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && messageModal.classList.contains('active')) {
                        closeMessageModal();
                    }
                });
            }
        }

        // Setup search and filter event listeners
        function setupSearchAndFilter() {
            const searchInput = document.getElementById('messageSearch');
            const statusFilter = document.getElementById('statusFilter');
            const spamBlockedBtn = document.getElementById('spamBlockedBtn');
            
            if (searchInput) {
                searchInput.addEventListener('input', filterMessages);
            }
            
            if (statusFilter) {
                statusFilter.addEventListener('change', filterMessages);
            }
            
            if (spamBlockedBtn) {
                spamBlockedBtn.addEventListener('click', () => {
                    isViewingSpam = !isViewingSpam;
                    
                    if (isViewingSpam) {
                        // Show only blocked messages
                        const blockedMessages = allMessages.filter(msg => msg.blocked);
                        renderMessages(blockedMessages);
                        spamBlockedBtn.classList.add('active');
                    } else {
                        // Show all non-blocked messages
                        filterMessages();
                        spamBlockedBtn.classList.remove('active');
                    }
                });
            }
        }

        // Make functions globally available
        window.toggleStar = toggleStar;
        window.toggleBlock = toggleBlock;
        window.showMessageDetail = showMessageDetail;
        window.markAsRead = markAsRead;
        window.deleteMessage = deleteMessage;
        window.closeMessageModal = closeMessageModal;
        window.filterMessages = filterMessages;
        window.handleReplySubmit = handleReplySubmit;
        window.cancelReply = cancelReply;
        window.toggleReplySection = toggleReplySection;

        // Setup notification and profile popups
        function setupNotificationAndProfile() {
            const notificationBtn = document.getElementById('notificationBtn');
            const notificationPopup = document.getElementById('notificationPopup');
            const profileBtn = document.getElementById('profileBtn');
            const profilePopup = document.getElementById('profilePopup');

            // Notification Popup Toggle
            if (notificationBtn && notificationPopup) {
                notificationBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    notificationPopup.classList.toggle('active');
                    if (profilePopup) {
                        profilePopup.classList.remove('active');
                    }
                });
            }

            // Profile Popup Toggle
            if (profileBtn && profilePopup) {
                profileBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    profilePopup.classList.toggle('active');
                    if (notificationPopup) {
                        notificationPopup.classList.remove('active');
                    }
                });
            }

            // Close popups when clicking outside
            document.addEventListener('click', (e) => {
                if (notificationPopup && !notificationPopup.contains(e.target) && notificationBtn && !notificationBtn.contains(e.target)) {
                    notificationPopup.classList.remove('active');
                }
                if (profilePopup && !profilePopup.contains(e.target) && profileBtn && !profileBtn.contains(e.target)) {
                    profilePopup.classList.remove('active');
                }
            });
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setupModalHandlers();
                setupSearchAndFilter();
                setupNotificationAndProfile();
                loadMessagesFromAPI();
            });
        } else {
            setupModalHandlers();
            setupSearchAndFilter();
            setupNotificationAndProfile();
            loadMessagesFromAPI();
        }
    </script>
    <script src="../../scripts/admin/messages.js"></script>
</body>
</html>
