<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchField - Forgot password</title>
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="../../styles/shared/base.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="logo">
                <img src="../../assets/images/logo/A modern logo for a .png" alt="MatchField" class="logo-icon">
            </div>
            <h1 class="headline">Back on the pitch in no time.</h1>
            <p class="description">Enter the email you use for MatchField. If an account exists, you will get a way to set a new password.</p>
        </div>

        <div class="right-section">
            <div class="login-card">
                <h2 class="login-title">Forgot password</h2>
                <p class="welcome-text">Submit your email. For security, the result is the same whether or not the address is registered.</p>

                <form class="login-form" id="forgotForm" autocomplete="off">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Send reset link</button>
                </form>

                <p class="signup-text">
                    Remember your password? <a href="login.html" class="signup-link">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="../../scripts/utils/runtime-api-port.js"></script>
    <script src="../../scripts/utils/api.js"></script>
    <script src="../../scripts/auth/forgot-password.js"></script>
</body>
</html>
