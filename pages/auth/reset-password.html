<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../scripts/utils/locale-boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.pageReset">MatchField - Set new password</title>
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="../../styles/shared/base.css">
    <link rel="stylesheet" href="../../styles/shared/rtl.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="logo">
                <img src="../../assets/images/logo/A modern logo for a .png" alt="MatchField" data-i18n-alt="accessibility.logo" class="logo-icon">
            </div>
            <h1 class="headline" data-i18n="auth.resetHeadline">Choose a strong new password.</h1>
            <p class="description">Use at least 8 characters. After saving, sign in with your email and the new password.</p>
        </div>

        <div class="right-section">
            <div class="login-card">
                <h2 class="login-title" data-i18n="auth.setNewPassword">Set new password</h2>
                <p class="welcome-text" id="tokenHint" data-i18n="auth.resetSubtitle">Enter your new password below.</p>

                <form class="login-form" id="resetForm" autocomplete="off" hidden>
                    <div class="form-group">
                        <label for="password" data-i18n="auth.newPassword">New password</label>
                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="At least 8 characters"
                                data-i18n-placeholder="auth.atLeast8"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                            <button type="button" class="password-toggle-btn" data-target="password" aria-label="Show password" data-i18n-aria-label="accessibility.showPassword">
                                <i class="fi fi-rr-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="passwordConfirm" data-i18n="auth.confirmPassword">Confirm password</label>
                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="passwordConfirm"
                                name="passwordConfirm"
                                placeholder="Repeat new password"
                                data-i18n-placeholder="auth.repeatNewPassword"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                            <button type="button" class="password-toggle-btn" data-target="passwordConfirm" aria-label="Show password" data-i18n-aria-label="accessibility.showPassword">
                                <i class="fi fi-rr-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="auth.updatePassword">Update password</button>
                </form>

                <p class="signup-text" id="footerLinks">
                    <a href="forgot-password.html" class="signup-link" data-i18n="auth.requestNewLink">Request a new link</a>
                    &nbsp;·&nbsp;
                    <a href="login.html" class="signup-link" data-i18n="auth.logIn">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="../../scripts/utils/runtime-api-port.js"></script>
    <script src="../../scripts/utils/api.js"></script>
    <script src="../../scripts/utils/preferences.js"></script>
    <script src="../../scripts/utils/i18n-catalog.js"></script>
    <script src="../../scripts/utils/i18n.js"></script>
    <script src="../../scripts/auth/reset-password.js"></script>
</body>
</html>
