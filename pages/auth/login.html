<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../scripts/utils/locale-boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.pageLogin">MatchField - Log in to your account</title>
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="../../styles/shared/base.css">
    <link rel="stylesheet" href="../../styles/shared/rtl.css">
</head>
<body>
    <div class="container">
        <!-- Left Section - Promotional Content -->
        <div class="left-section">
            <div class="logo">
                <img src="../../assets/images/logo/A modern logo for a .png" alt="MatchField" data-i18n-alt="accessibility.logo" class="logo-icon">
            </div>
            
            <h1 class="headline" data-i18n="auth.loginHeadline">Book fields in seconds.</h1>
            <p class="description" data-i18n="auth.loginDescription">Find nearby sports fields, check live availability, and secure your slot with instant confirmation.</p>
            
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-number" id="loginStatFields">—</div>
                    <div class="stat-label" data-i18n="auth.fieldsListed">Fields listed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">98%</div>
                    <div class="stat-label" data-i18n="auth.happyPlayers">Happy players</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">24/7</div>
                    <div class="stat-label" data-i18n="auth.support247">Support</div>
                </div>
            </div>
        </div>

        <!-- Right Section - Login Form -->
        <div class="right-section">
            <div class="login-card">
                <h2 class="login-title" data-i18n="auth.loginTitle">Log in to your account</h2>
                <p class="welcome-text" data-i18n="auth.welcomeBack">Welcome back! Please enter your details.</p>

                <div class="oauth-error" id="oauthErrorBox" role="alert" hidden></div>
                
                <form class="login-form" id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="email" data-i18n="auth.email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email"
                            data-i18n-placeholder="auth.enterEmail"
                            autocomplete="email"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="password" data-i18n="auth.password">Password</label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password"
                                data-i18n-placeholder="auth.enterPassword"
                                autocomplete="new-password"
                                required
                            >
                            <button type="button" class="password-toggle-btn" data-target="password" aria-label="Show password" data-i18n-aria-label="accessibility.showPassword">
                                <i class="fi fi-rr-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-options form-options--end">
                        <a href="forgot-password.html" class="forgot-password" data-i18n="auth.forgotPassword">Forgot password</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" data-i18n="auth.logIn">Log in</button>
                </form>

                <div class="google-auth-section" id="googleAuthSection" hidden>
                    <div class="auth-divider"><span data-i18n="auth.google.or">or</span></div>
                    <button type="button" class="btn btn-google" id="googleLoginBtn">
                        <svg class="btn-google-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
                        </svg>
                        <span class="btn-google-label" data-i18n="auth.google.continue">Continue with Google</span>
                    </button>
                </div>
                
                <p class="signup-text">
                    <span data-i18n="auth.noAccount">Don't have an account?</span> <a href="signup.html" class="signup-link" data-i18n="auth.signUp">Sign up</a>
                </p>
            </div>
        </div>
    </div>
    
    <script src="../../scripts/utils/runtime-api-port.js"></script>
    <script src="../../scripts/utils/api.js"></script>
    <script src="../../scripts/utils/preferences.js"></script>
    <script src="../../scripts/utils/i18n-catalog.js"></script>
    <script src="../../scripts/utils/i18n.js"></script>
    <script src="../../scripts/utils/auth-redirect.js"></script>
    <script src="../../scripts/auth/login.js"></script>
    <script>
      // Keep user on login when pressing Back: ensure every Back stays on login
      (function() {
        if (typeof history === 'undefined' || !history.pushState) return;
        var loginUrl = location.pathname + (location.search || '');
        // Add several login entries so Back always lands on login
        for (var i = 0; i < 3; i++) history.pushState({ loginPage: true }, '', loginUrl);
        window.addEventListener('popstate', function() {
          // Always push another login so the next Back again stays on login
          history.pushState({ loginPage: true }, '', loginUrl);
        });
      })();
    </script>
</body>
</html>
